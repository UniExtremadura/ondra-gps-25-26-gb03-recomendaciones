spring.profiles.active=dev

# ============================================
# CONFIGURACION GENERAL
# ============================================
spring.application.name=recomendaciones-service

# ============================================
# CONFIGURACION DEL SERVIDOR
# ============================================
server.port=${SERVER_PORT}
server.servlet.context-path=/
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Manejo de errores
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================
# CONFIGURACION DE BASE DE DATOS (PostgreSQL)
# ============================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# CONFIGURACION DE JPA/HIBERNATE
# ============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# CONFIGURACION JWT
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}

# ============================================
# COMUNICACION CON OTROS MICROSERVICIOS
# ============================================
microservices.usuarios.url=${USUARIOS_SERVICE_URL}
microservices.contenidos.url=${CONTENIDOS_SERVICE_URL}
microservices.service-token=${SERVICE_TOKEN}

# URL del frontend para enlaces
app.frontend.url=${FRONTEND_URL}

# ============================================
# CONFIGURACION DE LOGGING
# ============================================
logging.level.root=${LOG_LEVEL_ROOT}
logging.level.com.ondra.recomendaciones=${LOG_LEVEL_APP}
logging.level.org.springframework.web=${LOG_LEVEL_WEB}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_BINDER}

# ============================================
# CONFIGURACION DE ACTUATOR (Health Checks)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.db.enabled=true

management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Informacion de la aplicacion
info.app.name=ONDRA Recomendaciones Service
info.app.description=Microservicio de gestion de recomendaciones
info.app.version=1.0.0
info.app.encoding=UTF-8
info.app.java.version=17